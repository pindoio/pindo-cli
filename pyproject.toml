[project]
name = "pindo-cli"
version = "1.2.1"
description = "Command-line interface for the Pindo SMS API: log in, send test messages, manage your account and pull reports."
authors = [{ name = "Team Pindo", email = "team@pindo.io" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pindo", "sms", "cli", "reporting", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.8,<9",
    "requests>=2.33.0,<3",
    # Used through requests. The floor keeps installs off urllib3 releases with
    # known security advisories (streaming/decompression/proxy fixes in 2.7-2.8).
    "urllib3>=2.8.0,<3",
    "rich>=13.9,<16",
    "tomlkit>=0.13,<1",
    # Windows has no system timezone database; zoneinfo needs this for --tz.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://www.pindo.io/"
Documentation = "https://github.com/pindoio/pindo-cli#readme"
Repository = "https://github.com/pindoio/pindo-cli"
Issues = "https://github.com/pindoio/pindo-cli/issues"
Changelog = "https://github.com/pindoio/pindo-cli/blob/master/CHANGELOG.md"

[project.scripts]
pindo = "pindo_cli.cli:cli"

[tool.poetry]
packages = [{ include = "pindo_cli" }]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-cov = ">=7.0"
responses = ">=0.26"
coverage = { version = ">=7.6", extras = ["toml"] }
ruff = ">=0.17"
mypy = ">=2.0"
types-requests = ">=2.33"
pre-commit = { version = ">=4.0", python = ">=3.11" }

[build-system]
requires = ["poetry-core>=2.0.0,<3"]
build-backend = "poetry.core.masonry.api"

# ------------------------------------------------------------------ tools

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "C4",           # comprehensions
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "PT",           # pytest style
    "C90",          # complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "single"
exclude = ["*.md"]  # leave code samples in the docs as written

[tool.mypy]
python_version = "3.10"
files = ["pindo_cli"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "live: tests that call the real Pindo API (skipped unless --run-live)",
]

[tool.coverage.run]
source = ["pindo_cli"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.semantic_release]
# Version comes from tags; pyproject.toml is stamped and committed on release.
version_toml = ["pyproject.toml:project.version"]
build_command = "python -m pip install --upgrade build && python -m build"
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "master"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!--next-version-placeholder-->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
