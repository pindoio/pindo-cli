[tool.poetry]
name = "pindo-cli"
version = "0.2.1"
description = "A simple Command Line Interface that allows you to authenticate with the Pindo API."
authors = ["Team Pindo <team@pindo.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/pindoio/pindo-cli"
repository = "https://github.com/pindoio/pindo-cli"
documentation = "https://github.com/pindoio/pindo-cli"
keywords = ["pindo", "sms", "cli", "reporting"]
classifiers=[
        'Environment :: Console',
        'Intended Audience :: Developers',
        'License :: OSI Approved :: MIT License',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: MacOS',
        'Operating System :: POSIX :: Linux',
        'Programming Language :: Python :: 3.9',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
]
packages = [
    { include = "pindo_cli" }
]

[tool.semantic_release]
version_variable = [
    "pindo_cli/__init__.py:__version__",
    "pyproject.toml:version"
]
branch = "master"
upload_to_pypi = true
upload_to_release = true
build_command = "pip install poetry && poetry build"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1"
requests = "^2.31"
rich = "^13.0"
tomlkit = "^0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
responses = "^0.25"
coverage = {version = "^7.0", extras = ["toml"]}
flake8 = "^7.0"
flake8-bugbear = "^24.0"

[tool.pytest.ini_options]
markers = [
    "live: tests that call the real Pindo API (skipped unless --run-live)",
]

[tool.coverage.run]
omit = [".*", "*/site-packages/*", "*/distutils/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pindo = 'pindo_cli.cli:cli'
