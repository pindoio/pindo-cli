name: Publish tag

# Manually (re)publish an existing release tag to PyPI, e.g. when the
# automatic upload in the Release workflow failed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v1.2.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the distributions to the GitHub release
      id-token: write  # PyPI Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true

      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
